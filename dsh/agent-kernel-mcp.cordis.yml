# DeepSeek Harness (Docker) — insert MCP → agent-kernel API.
# Requires AGENT_KERNEL_URL. Token optional at boot; set AGENT_KERNEL_TOKEN after web login (ak_session).
- insert:
    - id: mcp-agent-kernel
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: agent_kernel
        transport: stdio
        command: node
        args: ['/opt/agent-kernel-mcp/dist/index.js']
        env:
          AGENT_KERNEL_URL: !!js {
            const u = process.env.AGENT_KERNEL_URL
            if (!u) throw new Error('AGENT_KERNEL_URL required (control-plane base URL)')
            return u
          }
          AGENT_KERNEL_TOKEN: !!js process.env.AGENT_KERNEL_TOKEN || ''
        cwd: /opt/agent-kernel-mcp
        toolCallTimeoutMs: 60000
        failOnStartupError: true
